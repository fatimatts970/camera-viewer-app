name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build APK using Kivy Buildozer Docker image
        run: |
          docker run --rm -v "$(pwd)":/home/user/hostcwd kivy/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AHMAD-Camera-Viewer-APK
          path: bin/*.apk
